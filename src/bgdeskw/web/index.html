<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f5fe0">
<title>Agent workplace</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <button id="back" class="back" type="button" hidden aria-label="Back to all agents">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <h1 id="title">Agent workplace</h1>
  <span id="crumb" class="crumb" hidden></span>
  <span class="spacer"></span>
  <span id="conn" class="conn" role="status"><span class="dot"></span><span id="connText">Connecting</span></span>
</header>

<main>
  <section id="grid" class="grid" aria-label="Agents"></section>
  <p id="empty" class="empty" hidden>No agents connected.</p>
  <p id="down" class="empty" hidden>The background desktop is not running.</p>

  <section id="focus" class="focus" hidden aria-label="Agent view">
    <div class="work">
      <div class="controls">
        <p id="status" class="status" role="status"></p>
        <button id="take" class="btn primary" type="button">Take over</button>
        <button id="handback" class="btn" type="button" hidden>Hand back</button>
      </div>
      <div id="help" class="help" hidden>
        <p><strong>Needs you</strong> <span id="helpText"></span></p>
        <button id="dismiss" class="btn" type="button">Dismiss</button>
      </div>
      <div class="stage" id="stage">
        <img id="picture" alt="Live view of the agent's screen" draggable="false">
        <textarea id="sink" class="sink" aria-label="Keyboard input to the agent's screen" autocomplete="off" autocapitalize="off" spellcheck="false" tabindex="-1"></textarea>
        <p id="waiting" class="waiting">Waiting for the picture</p>
      </div>
    </div>
    <aside class="side">
      <h2>Timeline</h2>
      <ol id="actions" class="actions"></ol>
      <h2>Windows</h2>
      <ul id="windows" class="windows"></ul>
    </aside>
  </section>
</main>
<p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
<script src="/app.js"></script>
</body>
</html>
